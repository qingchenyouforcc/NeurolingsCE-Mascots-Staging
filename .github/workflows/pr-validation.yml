name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  registry-checks:
    name: Registry / schema / duplicate checks (trusted base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Validate registry on base
        run: python3 tools/validate_registry.py . --json
      - name: Registry unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"
      - name: Deterministic index generation
        run: |
          python3 tools/generate_index.py . --generated-at 2026-01-01T00:00:00Z \
            --output /tmp/index-first.json
          python3 tools/generate_index.py . --generated-at 2026-01-01T00:00:00Z \
            --output /tmp/index-second.json
          diff -u /tmp/index-first.json /tmp/index-second.json
      - name: Verify changed files and PR manifest (API only, no asset download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ vars.REGISTRY_OWNER || 'qingchenyouforcc' }}
          GH_REPO: ${{ vars.REGISTRY_REPO || 'NeurolingsCE-Mascots' }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from workflow_helpers import verify_pr_registry_only
          result = verify_pr_registry_only(
              token=os.environ["GH_TOKEN"],
              owner=os.environ["GH_OWNER"],
              repo=os.environ["GH_REPO"],
              pr_number=int(os.environ["GH_PR_NUMBER"]),
              repo_root=Path("."),
          )
          print(json.dumps(result, sort_keys=True))
          PY
