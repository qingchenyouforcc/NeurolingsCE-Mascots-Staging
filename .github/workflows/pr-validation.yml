name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  registry-checks:
    name: Registry / schema / duplicate checks (trusted base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Validate registry
        run: python3 tools/validate_registry.py . --json
      - name: Registry unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"
      - name: Deterministic index generation
        run: |
          python3 tools/generate_index.py . --generated-at 2026-01-01T00:00:00Z \
            --output /tmp/index-first.json
          python3 tools/generate_index.py . --generated-at 2026-01-01T00:00:00Z \
            --output /tmp/index-second.json
          diff -u /tmp/index-first.json /tmp/index-second.json

  package-validation:
    name: Package safety validation with public CLI validator
    runs-on: ubuntu-latest
    steps:
      # Trusted tools only: checkout the BASE commit, never the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify changed files and download draft asset (API only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ vars.REGISTRY_OWNER || 'qingchenyouforcc' }}
          GH_REPO: ${{ vars.REGISTRY_REPO || 'NeurolingsCE-Mascots' }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from workflow_helpers import verify_pr_manifest_and_download_asset
          result = verify_pr_manifest_and_download_asset(
              token=os.environ["GH_TOKEN"],
              owner=os.environ["GH_OWNER"],
              repo=os.environ["GH_REPO"],
              pr_number=int(os.environ["GH_PR_NUMBER"]),
              dest_dir=Path("/tmp"),
          )
          Path("/tmp/package.mascot").write_bytes(
              Path(result["assetPath"]).read_bytes()
          )
          Path("/tmp/manifest.json").write_text(
              json.dumps(result["manifest"], sort_keys=True), encoding="utf-8"
          )
          trace = dict(result["apiTrace"])
          trace.update({
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "workflowEvent": os.environ.get("GITHUB_EVENT_NAME", ""),
              "jobPermissions": "contents: read, pull-requests: read",
              "owner": os.environ["GH_OWNER"],
              "repo": os.environ["GH_REPO"],
              "prNumber": int(os.environ["GH_PR_NUMBER"]),
          })
          Path("/tmp/api-trace.json").write_text(
              json.dumps(trace, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps({
              "mascotId": result["mascotId"],
              "version": result["version"],
              "submissionId": result["submissionId"],
              "releaseId": result["releaseId"],
              "assetId": result["assetId"],
              "tag": result["tag"],
              "apiTrace": result["apiTrace"],
          }, sort_keys=True))
          PY
      - name: Record E2E API trace (sanitized, no credentials)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          trace_path = Path("/tmp/api-trace.json")
          if not trace_path.exists():
              print("::error::api trace was not produced")
              raise SystemExit(1)
          trace = json.loads(trace_path.read_text(encoding="utf-8"))
          assert "Authorization" not in trace_path.read_text(encoding="utf-8")
          print("apiTrace=" + json.dumps(trace, sort_keys=True))
          PY
      - name: Build public validator from NeurolingsCE
        run: |
          git clone --depth 1 \
            https://github.com/${{ vars.VALIDATOR_REPO || 'qingchenyouforcc/NeurolingsCE' }}.git \
            /tmp/neurolingsce
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev ninja-build
          cmake -S /tmp/neurolingsce -B /tmp/neurolingsce-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/neurolingsce-build --target NeurolingsCECli --parallel 2
      - name: Validate package with trusted CLI
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from workflow_helpers import cli_validate
          package = Path("/tmp/package.mascot")
          if not package.exists():
              print("::error::draft asset was not downloaded")
              sys.exit(1)
          ok, report = cli_validate(
              Path("/tmp/neurolingsce-build/bin/NeurolingsCE-cli"), package
          )
          print(json.dumps(report, sort_keys=True))
          package.unlink(missing_ok=True)
          Path("/tmp/manifest.json").unlink(missing_ok=True)
          if not ok:
              sys.exit(1)
          PY
