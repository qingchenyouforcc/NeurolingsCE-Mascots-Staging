name: Publish and deploy

on:
  push:
    branches: [main]
    paths: ["mascots/**"]
  workflow_dispatch:

# Serialize runs with an explicit queue: new runs wait instead of replacing a
# pending run (default behavior would keep only one pending and cancel it).
# generate_index queries live Release state, so every run converges to the
# actual published state at execution time.
concurrency:
  group: publish-and-deploy
  queue: max

permissions: {}

jobs:
  publish_releases:
    name: Publish verified draft releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate registry before publishing
        run: python3 tools/validate_registry.py . --json
      - name: Build public validator from NeurolingsCE
        run: |
          git clone --depth 1 \
            https://github.com/${{ vars.VALIDATOR_REPO || 'qingchenyouforcc/NeurolingsCE' }}.git \
            /tmp/neurolingsce
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qttools6-dev ninja-build
          cmake -S /tmp/neurolingsce -B /tmp/neurolingsce-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/neurolingsce-build --target NeurolingsCECli --parallel 2
      - name: Publish verified drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ vars.REGISTRY_OWNER || 'qingchenyouforcc' }}
          GH_REPO: ${{ vars.REGISTRY_REPO || 'NeurolingsCE-Mascots' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from workflow_helpers import (
              cli_validate,
              download_release_asset,
              load_manifest,
              publish_release,
              verify_release_before_publish,
          )

          token = os.environ["GH_TOKEN"]
          owner = os.environ["GH_OWNER"]
          repo = os.environ["GH_REPO"]
          published = 0
          already = 0
          skipped = 0
          for manifest_path in sorted(Path("mascots").glob("*/manifest.json")):
              manifest = load_manifest(manifest_path)
              meta = manifest.get("release") or {}
              release_id = meta.get("releaseId")
              if not release_id:
                  skipped += 1
                  continue
              mid = manifest.get("id", "?")
              version = manifest.get("version", "?")
              state = verify_release_before_publish(
                  token, owner, repo, int(release_id), manifest,
              )
              if state == "already_published":
                  already += 1
                  print(f"Release {release_id} for {mid} {version} already published; skipped")
                  continue
              tmp = Path(f"/tmp/verify-{mid}-{version}.mascot")
              try:
                  # Download through the verified asset id, never through a
                  # manifest-provided URL.
                  download_release_asset(
                      token, owner, repo, int(meta["assetId"]), tmp,
                      manifest["package"]["sha256"],
                  )
                  ok, report = cli_validate(
                      Path("/tmp/neurolingsce-build/bin/NeurolingsCE-cli"), tmp
                  )
                  if not ok:
                      print(json.dumps({
                          "error": "cli_validation_failed",
                          "mascotId": mid,
                          "version": version,
                          "report": report,
                      }, sort_keys=True))
                      sys.exit(1)
                  publish_release(token, owner, repo, int(release_id))
              finally:
                  tmp.unlink(missing_ok=True)
              published += 1
              print(f"Published {mid} {version} (release {release_id})")
          print(json.dumps({
              "published": published,
              "alreadyPublished": already,
              "skippedWithoutReleaseMetadata": skipped,
          }, sort_keys=True))
          PY

  generate_index:
    name: Generate index from published releases
    runs-on: ubuntu-latest
    needs: publish_releases
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate registry
        run: python3 tools/validate_registry.py . --json
      - name: Fetch published release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ vars.REGISTRY_OWNER || 'qingchenyouforcc' }}
          GH_REPO: ${{ vars.REGISTRY_REPO || 'NeurolingsCE-Mascots' }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from workflow_helpers import list_published_release_tags
          tags = list_published_release_tags(
              token=os.environ["GH_TOKEN"],
              owner=os.environ["GH_OWNER"],
              repo=os.environ["GH_REPO"],
          )
          Path("/tmp/published-tags.json").write_text(
              json.dumps(tags), encoding="utf-8"
          )
          print(json.dumps({"publishedTags": tags}, sort_keys=True))
          PY
      - name: Generate index from published releases
        run: |
          python3 tools/generate_index.py . --output generated/index-v1.json \
            --published-tags-file /tmp/published-tags.json
      - name: Upload generated index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-index
          path: generated
          if-no-files-found: error

  deploy_pages:
    name: Deploy index to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate_index
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download generated index
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: generated-index
          path: generated
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: generated
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
