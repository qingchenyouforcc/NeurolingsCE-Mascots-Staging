name: Clean up rejected submissions

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete draft releases for unmerged PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Clean up draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ vars.REGISTRY_OWNER || 'qingchenyouforcc' }}
          GH_REPO: ${{ vars.REGISTRY_REPO || 'NeurolingsCE-Mascots' }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "tools")
          from workflow_helpers import (
              verify_and_cleanup_submission_pr,
          )
          result = verify_and_cleanup_submission_pr(
              token=os.environ["GH_TOKEN"],
              owner=os.environ["GH_OWNER"],
              repo=os.environ["GH_REPO"],
              pr_number=int(os.environ["GH_PR_NUMBER"]),
          )
          print(json.dumps(result, sort_keys=True))
          if not result.get("verified"):
              print(f"::warning::cleanup skipped: {result.get('reason', 'unverified')}")
          PY
