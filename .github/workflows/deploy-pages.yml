name: Deploy index to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["mascots/**", "schemas/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Generate and deploy index-v1.json
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # TODO(maintainers): pin third-party actions to full commit SHAs before enabling.
      - uses: actions/checkout@v4
      - name: Validate registry
        run: python3 tools/validate_registry.py . --json
      - name: Generate index
        run: python3 tools/generate_index.py . --output generated/index-v1.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: generated
      - id: deployment
        uses: actions/deploy-pages@v4
